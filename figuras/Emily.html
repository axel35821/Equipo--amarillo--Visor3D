<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emily animada</title>
<style>
  body { margin: 0; min-height: 100vh; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Arial, sans-serif; }
  svg { height: 80vh; width: auto; overflow: visible; }
  .controles { display: flex; gap: 10px; margin: 12px 0; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #0B0F19; color: #fff; font-weight: bold; cursor: pointer; }
  button:hover { background: #0075E1; }

  /* Colores originales */
  .fil2  { fill: #0B0F19; }
  .fil3  { fill: #4A2D1D; }
  .fil4  { fill: #FFC294; }
  .fil5  { fill: #331A00; }
  .fil6  { fill: #FFD738; }
  .fil7  { fill: #0075E1; }
  .fil8  { fill: #2C160B; }
  .fil9  { fill: #102542; }
  .fil10 { fill: #A3B1C6; }
  .fil0  { fill: none; }
  .str1  { stroke: #4A2D1D; stroke-width: 79.38; stroke-miterlimit: 22.9256; }
  .str5  { stroke: #F58634; stroke-width: 135.46; stroke-miterlimit: 22.9256; }
  .str6  { stroke: #00A859; stroke-width: 67.73; stroke-miterlimit: 22.9256; }

  /* Todas las partes que se mueven */
  .parte { transform-box: fill-box; transform-origin: center; }
  .cuerpo, .mano-i, .mano-d, .zapato-i, .zapato-d { transform-box: fill-box; }
  .ojo { transform-box: fill-box; transform-origin: center; animation: parpadeo 4s infinite; }

  @keyframes parpadeo { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

  /* ---------- REPOSO ---------- */
  [data-modo="reposo"] .cuerpo   { animation: respirar 2.4s ease-in-out infinite; }
  [data-modo="reposo"] .mano-i   { animation: balanceo 2.4s ease-in-out infinite; }
  [data-modo="reposo"] .mano-d   { animation: balanceo 2.4s ease-in-out infinite reverse; }
  @keyframes respirar { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-70px); } }
  @keyframes balanceo { 0%,100% { transform: translateY(0); } 50% { transform: translateY(60px); } }

  /* ---------- CAMINAR ---------- */
  [data-modo="caminar"] .cuerpo   { animation: paso 0.6s ease-in-out infinite; }
  [data-modo="caminar"] .mano-i   { animation: brazo 0.6s ease-in-out infinite; }
  [data-modo="caminar"] .mano-d   { animation: brazo 0.6s ease-in-out infinite reverse; }
  [data-modo="caminar"] .zapato-i { animation: pie 0.6s ease-in-out infinite; }
  [data-modo="caminar"] .zapato-d { animation: pie 0.6s ease-in-out infinite reverse; }
  @keyframes paso  { 0%,100% { transform: translate(-40px, 0); } 25%,75% { transform: translate(0, -90px); } 50% { transform: translate(40px, 0); } }
  @keyframes brazo { 0%,100% { transform: translateY(-120px); } 50% { transform: translateY(120px); } }
  @keyframes pie   { 0%,100% { transform: translate(0, 0); } 50% { transform: translate(0, -260px); } }

  /* ---------- SALTAR ---------- */
  [data-modo="saltar"] .cuerpo   { animation: salto 0.9s ease-in-out infinite; }
  [data-modo="saltar"] .mano-i   { animation: manos-arriba 0.9s ease-in-out infinite; }
  [data-modo="saltar"] .mano-d   { animation: manos-arriba 0.9s ease-in-out infinite; }
  [data-modo="saltar"] .zapato-i,
  [data-modo="saltar"] .zapato-d { animation: pies-arriba 0.9s ease-in-out infinite; }
  @keyframes salto { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-900px); } }
  @keyframes manos-arriba { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-400px); } }
  @keyframes pies-arriba { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-200px); } }
</style>
</head>
<body>

<div class="controles">
  <button onclick="modo('reposo')">Reposo</button>
  <button onclick="modo('caminar')">Caminar</button>
  <button onclick="modo('saltar')">Saltar</button>
</div>

    <!-- Zapato izquierdo (contorno + zapato) -->

    <g class="zapato-d">

    </g>

  </g>
</svg>

<script>
  function modo(nombre) {
    document.getElementById('emily').setAttribute('data-modo', nombre);
  }
</script>

</body>
</html>
