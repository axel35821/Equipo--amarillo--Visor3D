<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funciones 3D - Francisco Javier</title>

    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 1.5rem;
        }

        canvas {
            background-color: #111;
            border: 2px solid #444;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
        }

        .controles {
            margin-top: 20px;
            padding: 15px;
            background-color: #292929;
            border-radius: 10px;
            width: 350px;
            max-width: 90%;
        }

        .control {
            margin: 15px 0;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        button {
            padding: 8px 15px;
            background-color: #00bfa5;
            color: black;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Mis funciones del Visor 3D</h1>
    <h2>Traslación de figuras</h2>

    <canvas id="visorCanvas" width="800" height="600"></canvas>

    <div class="controles">
        <h3>Controles de traslación</h3>

        <div class="control">
            <label for="ejeX">Eje X: <span id="valorX">0</span></label>
            <input type="range" id="ejeX" min="-100" max="100" value="0">
        </div>

        <div class="control">
            <label for="ejeY">Eje Y: <span id="valorY">0</span></label>
            <input type="range" id="ejeY" min="-100" max="100" value="0">
        </div>

        <div class="control">
            <label for="ejeZ">Eje Z: <span id="valorZ">0</span></label>
            <input type="range" id="ejeZ" min="-100" max="100" value="0">
        </div>

        <button id="reiniciar">Restablecer posición</button>
    </div>

    <script>
        const canvas = document.getElementById("visorCanvas");
        const ctx = canvas.getContext("2d");

        // Valores iniciales de traslación
        let trasladoX = 0;
        let trasladoY = 0;
        let trasladoZ = 0;

        // Obtener los controles
        const controlX = document.getElementById("ejeX");
        const controlY = document.getElementById("ejeY");
        const controlZ = document.getElementById("ejeZ");

        // Vértices del cubo en coordenadas 3D
        const vertices = [
            {x:-50, y:-50, z:-50},
            {x: 50, y:-50, z:-50},
            {x: 50, y: 50, z:-50},
            {x:-50, y: 50, z:-50},
            {x:-50, y:-50, z: 50},
            {x: 50, y:-50, z: 50},
            {x: 50, y: 50, z: 50},
            {x:-50, y: 50, z: 50}
        ];

        // Aristas que forman el cubo
        const aristas = [
            [0,1], [1,2], [2,3], [3,0],
            [4,5], [5,6], [6,7], [7,4],
            [0,4], [1,5], [2,6], [3,7]
        ];

        // Proyección de coordenadas 3D a 2D
        function proyectar(punto) {

            const x = punto.x + trasladoX;
            const y = punto.y + trasladoY;
            const z = punto.z + trasladoZ + 200;

            // Evitar una profundidad demasiado cercana o inválida
            const zSeguro = Math.max(50, z);

            const factor = 300 / zSeguro;

            return {
                x: x * factor + canvas.width / 2,
                y: y * factor + canvas.height / 2
            };
        }

        // Dibujar el cubo
        function dibujarCubo() {

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const proyectados = vertices.map(proyectar);

            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;

            aristas.forEach(arista => {

                const p1 = proyectados[arista[0]];
                const p2 = proyectados[arista[1]];

                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();

            });
        }

        // Actualizar la traslación del eje X
        controlX.addEventListener("input", function() {
            trasladoX = Number(controlX.value);
            document.getElementById("valorX").textContent = trasladoX;
            dibujarCubo();
        });

        // Actualizar la traslación del eje Y
        controlY.addEventListener("input", function() {
            trasladoY = Number(controlY.value);
            document.getElementById("valorY").textContent = trasladoY;
            dibujarCubo();
        });

        // Actualizar la traslación del eje Z
        controlZ.addEventListener("input", function() {
            trasladoZ = Number(controlZ.value);
            document.getElementById("valorZ").textContent = trasladoZ;
            dibujarCubo();
        });

        // Restablecer la posición del cubo
        document.getElementById("reiniciar").addEventListener("click", function() {

            trasladoX = 0;
            trasladoY = 0;
            trasladoZ = 0;

            controlX.value = 0;
            controlY.value = 0;
            controlZ.value = 0;

            document.getElementById("valorX").textContent = 0;
            document.getElementById("valorY").textContent = 0;
            document.getElementById("valorZ").textContent = 0;

            dibujarCubo();
        });

        // Dibujar el cubo al iniciar
        dibujarCubo();

    </script>

</body>
</html>
