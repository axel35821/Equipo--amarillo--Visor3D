<title>Edificio paramétrico</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 22px;
    background: #f2f2f2;
    color: #171717;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  h1 { margin: 4px 0; font-size: 24px; text-align: center; }
  .controles {
    width: min(620px, 100%);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    background: white;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 2px 10px #00000012;
  }
  .control { display: flex; flex-direction: column; gap: 8px; }
  .control label { font-weight: bold; font-size: 14px; }
  .control output { color: #0075E1; font-weight: bold; }
  input[type="range"] { width: 100%; accent-color: #0075E1; }
  button {
    grid-column: 1 / -1;
    justify-self: center;
    padding: 10px 18px;
    border: 0;
    border-radius: 8px;
    background: #0B0F19;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { background: #0075E1; }
  .marco {
    width: min(1000px, 96vw);
    height: min(65vh, 620px);
    min-height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #990000;
    border-radius: 12px;
  }
  .dibujo {
    width: 100%;
    height: 100%;
    display: block;
  }
  @media (max-width: 560px) {
    .controles { grid-template-columns: 1fr; }
    button { grid-column: 1; }
    .marco { height: 55vh; }
  }
</style>
</head>

  <h1>Edificio paramétrico</h1>

  <section class="controles">
    <div class="control">
      <label for="ancho">Parámetro 1: Ancho — <output id="valorAncho">100%</output></label>
      <input id="ancho" type="range" min="70" max="130" value="100" step="1">
    </div>
    <div class="control">
      <label for="alto">Parámetro 2: Alto — <output id="valorAlto">100%</output></label>
      <input id="alto" type="range" min="70" max="130" value="100" step="1">
    </div>
    <button type="button" id="reiniciar">Restablecer medidas</button>
  </section>

<script>
  const svg = document.getElementById("edificio");
  const grupoPrincipal = svg.querySelector("#Capa_x0020_1");
  const controlAncho = document.getElementById("ancho");
  const controlAlto = document.getElementById("alto");
  const valorAncho = document.getElementById("valorAncho");
  const valorAlto = document.getElementById("valorAlto");

  // Centro del viewBox original: 32000 x 20000.
  const centroX = 16000;
  const centroY = 10000;

  function actualizarEdificio() {
    const escalaX = Number(controlAncho.value) / 100;
    const escalaY = Number(controlAlto.value) / 100;

    valorAncho.textContent = controlAncho.value + "%";
    valorAlto.textContent = controlAlto.value + "%";

    if (grupoPrincipal) {
      // Escala desde el centro para mantener el edificio centrado.
      grupoPrincipal.setAttribute(
        "transform",
        `translate(${centroX * (1 - escalaX)} ${centroY * (1 - escalaY)}) scale(${escalaX} ${escalaY})`
      );
    }
  }

  controlAncho.addEventListener("input", actualizarEdificio);
  controlAlto.addEventListener("input", actualizarEdificio);

  document.getElementById("reiniciar").addEventListener("click", () => {
    controlAncho.value = 100;
    controlAlto.value = 100;
    actualizarEdificio();
  });

  // Elimina el fondo rojo interno del SVG si existe: el marco HTML ya lo proporciona.
  const fondo = svg.querySelector('#Capa_x0020_1 > rect[fill="#990000"], #Capa_x0020_1 > rect[style*="#990000"]');
  if (fondo) fondo.remove();

  actualizarEdificio();
</script>
